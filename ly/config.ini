# ly display manager — gruvbox theme
#
# The bare Linux TTY can't render 24-bit color: the kernel down-maps every
# truecolor escape to a 16-entry palette. So instead of asking ly for gruvbox
# truecolor (which would snap to muddy defaults), we run in 8-color mode and
# remap the console palette itself to gruvbox via setvtrgb — see
# ../systemd/console-palette.service and ./gruvbox-vtrgb. The palette is only
# applied while ly is up and restored to the kernel default when ly stops, so
# boot/shutdown logs keep their normal colors — only ly is styled.
#
# full_color = false → colors are 8-color termbox ids (0x01=slot0 .. 0x08=slot7),
# which index the console palette slots we remap. gruvbox slots (RGB in
# ../ly/gruvbox-vtrgb): slot0 bg #282828, slot6 aqua #689d6a, slot7 fg #a89984.
# bg=slot0 (0x01), border_fg=slot6 aqua (0x07), fg=slot7 cream (0x08).
full_color = false
fg = 0x08
bg = 0x01
border_fg = 0x07

# lean time in the top-right corner, rendered in the normal (thin) console font
# instead of ly's chunky hardcoded bigclock blocks
bigclock = none
clock = %H:%M

# no background animation, crisp box
animation = none
hide_borders = false
blank_box = true

# center the box
box_position_h = 0.5
box_position_v = 0.5
margin_box_h = 2
margin_box_v = 1

# password mask
asterisk = *
clear_password = true

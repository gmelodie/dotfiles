# tiny IRC configuration — migrated from irssi (see irssi/config).
#
# Identity and networks are carried over from the old irssi config. tiny
# highlights your own nick automatically, so irssi's `hilights = gmelodie`
# needs no config here. irssi's global "ignore JOINS PARTS QUITS NICKS" has no
# global equivalent in tiny 0.13 — hide those lines per-tab at runtime with
# `/ignore`, or per-channel with `ignore: true` on a join entry (example below).
#
# SASL uses ONE global client certificate for every network — SASL EXTERNAL /
# CertFP — instead of a stored password:
#
#     /home/gmelodie/.config/tiny/irc.pem   (generated by gen-irc-cert.sh)
#
# The cert is loaded automatically on startup. Enroll it once per network:
# connect (the first SASL attempt fails, you stay unauthenticated), then in
# that network's server tab run
#     /msg NickServ IDENTIFY <your-password>
#     /msg NickServ CERT ADD
# From then on tiny authenticates automatically with no password stored
# anywhere. SASL EXTERNAL requires TLS, which is why both servers below use it.

servers:
    - addr: irc.libera.chat
      port: 6697
      tls: true
      alias: Libera
      realname: gmelodie
      nicks: [gmelodie]
      sasl:
          pem: "/home/gmelodie/.config/tiny/irc.pem"
      # Autojoin channels here, e.g. to also hide join/part/quit for one:
      #   join:
      #       - "#libera"
      #       - name: "#irssi"
      #         ignore: true
      join: []

    - addr: irc.oftc.net
      port: 6697
      tls: true
      alias: OFTC
      realname: gmelodie
      nicks: [gmelodie]
      sasl:
          pem: "/home/gmelodie/.config/tiny/irc.pem"
      join: []

# Other networks from the old irssi config are not auto-connected (they had no
# autojoin and no SASL). Reach any of them on demand with `/connect`:
#     /connect irc.esper.net:6697        (EsperNet)
#     /connect irc.rizon.net:6697        (Rizon)
#     /connect ssl.efnet.org:9999        (EFNet)
#     /connect open.ircnet.net:6667      (IRCnet)
#     /connect irc.dal.net:6667          (DALnet)
#     /connect irc.undernet.org:6667     (Undernet)
#     /connect irc.quakenet.org:6667     (QuakeNet)
#     /connect irc.gamesurge.net:6667    (GameSurge)

# Used by `/connect` when no per-server entry exists above.
defaults:
    nicks: [gmelodie]
    realname: gmelodie
    join: []
    tls: true

# Chat logs (irssi had autolog = yes).
log_dir: "/home/gmelodie/.irclogs"
